name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 工程文件体检
        run: |
          xcodebuild -version
          plutil -lint NinebotCast.xcodeproj/project.pbxproj
          xcodebuild -list -project NinebotCast.xcodeproj

      - name: Xcodebuild（免签名构建）
        run: |
          set +e
          xcodebuild \
            -project NinebotCast.xcodeproj \
            -target NinebotCast \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build > build.log 2>&1
          CODE=$?
          tail -60 build.log
          echo "xcodebuild 退出码: $CODE"
          exit $CODE

      - name: 失败时把完整日志发到公开 paste 并用 notice 带出
        if: failure()
        run: |
          URL=$(curl -s -F "file=@build.log" https://0x0.st || true)
          if [ -z "$URL" ]; then
            URL=$(curl -s --data-binary @build.log https://paste.rs || true)
          fi
          echo "完整构建日志: $URL"
          echo "::notice::BUILD_LOG_URL=$URL"
          echo "完整构建日志: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: 打包 IPA
        if: success()
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -type d -name "NinebotCast.app" -path "*iphoneos*" | head -1)
          echo "找到: $APP"
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry NinebotCast-unsigned.ipa Payload
          ls -lh NinebotCast-unsigned.ipa

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NinebotCast-unsigned-ipa
          path: NinebotCast-unsigned.ipa
          retention-days: 90
