name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 工程文件体检
        run: |
          xcodebuild -version
          plutil -lint NinebotCast.xcodeproj/project.pbxproj
          xcodebuild -list -project NinebotCast.xcodeproj

      - name: Xcodebuild（免签名构建）
        run: |
          set +e
          xcodebuild \
            -project NinebotCast.xcodeproj \
            -target NinebotCast \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build > build.log 2>&1
          CODE=$?
          tail -60 build.log
          echo "xcodebuild 退出码: $CODE"
          exit $CODE

      - name: 失败时把完整日志发到公开 paste 并用 notice 带出
        if: failure()
        run: |
          URL=$(curl -s -F "file=@build.log" https://0x0.st || true)
          case "$URL" in
            https://*.*/*) ;;
            *) URL=$(curl -s --data-binary @build.log https://paste.rs || true) ;;
          esac
          case "$URL" in
            https://*.*/*) ;;
            *) URL="(paste 服务均不可用，看下方 tail 或 Action 页面)" ;;
          esac
          echo "完整构建日志: $URL"
          echo "::notice::BUILD_LOG_URL=$URL"
          echo "完整构建日志: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: 打包 IPA（含结构校验 + ldid 伪签名）
        if: success()
        run: |
          brew install ldid >/dev/null 2>&1 || true
          APP=$(find "$GITHUB_WORKSPACE/build" ~/Library/Developer/Xcode/DerivedData -type d -name "NinebotCast.app" 2>/dev/null | grep -i iphoneos | head -1)
          echo "找到: $APP"
          if [ -z "$APP" ]; then
            find "$GITHUB_WORKSPACE" ~/Library/Developer/Xcode/DerivedData -type d -name "*.app" 2>/dev/null | head -10
            exit 1
          fi
          rm -rf Payload
          mkdir Payload
          cp -R "$APP" Payload/
          # 伪签名主程序与扩展（越狱机 AppSync/Filza 安装必需）
          ldid -S Payload/NinebotCast.app/NinebotCast
          ldid -S Payload/NinebotCast.app/PlugIns/NinebotBroadcast.appex/NinebotBroadcast 2>/dev/null || \
            ldid -S Payload/NinebotCast.app/PlugIns/*.appex/* 2>/dev/null || true
          # 结构校验：必须存在 Payload/NinebotCast.app/Info.plist
          unzip -l NinebotCast-unsigned.ipa 2>/dev/null || zip -qry NinebotCast-unsigned.ipa Payload
          if ! unzip -l NinebotCast-unsigned.ipa | grep -q "Payload/NinebotCast.app/Info.plist"; then
            echo "::error::IPA 结构错误：缺少 Payload/NinebotCast.app/Info.plist"
            unzip -l NinebotCast-unsigned.ipa
            exit 1
          fi
          echo "::notice::IPA_OK=$(unzip -l NinebotCast-unsigned.ipa | grep -cE 'Payload/NinebotCast.app/') 个文件"
          ls -lh NinebotCast-unsigned.ipa

      - name: 上传产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NinebotCast-unsigned-ipa
          path: NinebotCast-unsigned.ipa
          retention-days: 90
