name: Build CarWithin iOS16Fix

on:
  push:
    branches: [carwithin-ios16fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract bundled identity from official release
        run: |
          set -e
          URL=$(curl -s https://api.github.com/repos/xmz28/CarWithin/releases/latest | python3 -c "
          import json,sys
          rs=json.load(sys.stdin)
          for a in rs.get('assets',[]):
              if a['name'].endswith('-unsigned.ipa'):
                  print(a['browser_download_url']); break
          ")
          echo "Official IPA: $URL"
          curl -sL "$URL" -o official.ipa
          mkdir -p official_extract App/BundledIdentity
          cd official_extract && unzip -q ../official.ipa && cd ..
          APP=$(ls -d official_extract/Payload/*.app)
          cp "$APP/certificate.p7b" "$APP/leaf.cer" "$APP/private.x963" App/BundledIdentity/
          ls -la App/BundledIdentity/

      - name: Generate project
        run: python3 Tools/generate_project.py

      - name: Build (unsigned arm64)
        run: |
          xcodebuild -project TDSCarKit.xcodeproj -scheme TDSCarKit \
            -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TDSCarKit.app Payload/
          zip -qry CarWithin-ios16fix-unsigned.ipa Payload
          ls -la CarWithin-ios16fix-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarWithin-ios16fix-unsigned
          path: CarWithin-ios16fix-unsigned.ipa

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete ios16fix --yes --cleanup-tag 2>/dev/null || true
          git push origin :refs/tags/ios16fix 2>/dev/null || true
          gh release create ios16fix CarWithin-ios16fix-unsigned.ipa \
            --title "CarWithin iOS16Fix 自动构建" \
            --notes "iOS 16 兼容实验构建：enabledFeatures 增加 iAPChannel、sourceVersion 950.7.1、屏幕流 111/130 兼容、primaryInputDevice 布尔化。未签名，用 TrollStore 安装。"
